onboarding = false
[ui]
show_agent_labels_on_pane_borders = true
pane_gaps = false
pane_borders = true
prompt_new_tab_name = false

[remote]
manage_ssh_config = true

[experimental]
pane_history = true
allow_nested = true

[theme]
name = "terminal"

auto_switch = false
[keys]
prefix = "ctrl+space"
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"
zoom = "prefix+z"
copy_mode = "prefix+["
last_pane = "prefix+;"
focus_agent = "prefix+alt+1..9"
switch_workspace = "prefix+shift+1..9"

# Override herdr's built-in "new worktree" key (prefix+shift+g) with worktrunk's
# default-branch switch/create picker:
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

# Optional: bind current-branch creation separately.
[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch / create from current branch"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "herdr-zoxide.browse"
description = "Browse zoxide directories"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"
